/* =========================================================
   RAKKEZ PRODUCTIVITY CENTER

========================================================= */

/* =========================================================
   HABITS PAGE
========================================================= */

function renderHabits() {

    const container =
        document.getElementById("habitsGrid");

    /* Weekly tracker. */
    renderWeeklyHabitTracker();

    if (!data.habits.length) {

        container.innerHTML = `
            <div class="card empty">

                <div class="empty-icon">
                    🌿
                </div>

                <strong>
                    No habits yet
                </strong>

                <p>
                    Add a habit to start building your routine.
                </p>

            </div>
        `;

        return;
    }

    const today = dateKey();

    const days = getLast7Days();

    container.innerHTML =
        data.habits.map(habit => {

            const done =
                isHabitCompleted(
                    habit,
                    today
                );

            const completedDays =
                days.filter(day =>
                    isHabitCompleted(
                        habit,
                        dateKey(day)
                    )
                ).length;

            const percent =
                Math.round(
                    (completedDays / 7) * 100
                );

            const todayMinutes =
                getHabitMinutes(
                    habit,
                    today
                );

            const streak =
                calculateHabitStreak(habit);

            return `
                <div class="card habit-card">

                    <div class="habit-top">

                        <div class="habit-main">

                            <div class="habit-icon-large">
                                ${escapeHTML(habit.icon)}
                            </div>

                            <div>

                                <div class="habit-name">
                                    ${escapeHTML(habit.name)}
                                </div>

                                <div class="habit-streak">
                                    ${streak} day${streak === 1 ? "" : "s"} streak
                                </div>

                            </div>

                        </div>

                        <div class="habit-actions">

                            <button
                                class="small-button"
                                onclick="editHabit('${habit.id}')"
                                title="Edit habit"
                            >
                                ✎
                            </button>

                            <button
                                class="small-button"
                                onclick="deleteHabit('${habit.id}')"
                                title="Delete habit"
                            >
                                ×
                            </button>

                        </div>

                    </div>


                    <div class="habit-progress-row">

                        <span>
                            <strong class="habit-percent">
                                ${completedDays}/7
                            </strong>
                        </span>

                        <span class="habit-percent">
                            ${percent}%
                        </span>

                    </div>


                    <div class="habit-progress">

                        <div
                            class="habit-progress-fill"
                            style="width:${percent}%"
                        ></div>

                    </div>


                    <div class="week-days">

                        ${days.map(day => {

                            const key =
                                dateKey(day);

                            const completed =
                                isHabitCompleted(
                                    habit,
                                    key
                                );

                            const isToday =
                                key === today;

                            return `
                                <div
                                    class="
                                        day
                                        ${completed ? "done" : ""}
                                        ${isToday ? "today" : ""}
                                    "
                                >

                                    <div class="day-name">
                                        ${day.toLocaleDateString(
                                            "en-US",
                                            {
                                                weekday: "short"
                                            }
                                        )}
                                    </div>

                                    <div class="day-dot">
                                        ${completed ? "✓" : ""}
                                    </div>

                                </div>
                            `;

                        }).join("")}

                    </div>


                    <button
                        class="
                            habit-check
                            ${done ? "completed" : ""}
                        "
                        onclick="toggleHabit('${habit.id}')"
                    >

                        ${
                            done
                                ? `✓ Completed${todayMinutes ? ` · ${formatMinutes(todayMinutes)}` : ""}`
                                : "Mark as completed"
                        }

                    </button>

                </div>
            `;

        }).join("");
}


/* =========================================================
   HABIT STREAK
========================================================= */

function calculateHabitStreak(habit) {

    let streak = 0;

    const cursor =
        new Date();

    while (
        isHabitCompleted(
            habit,
            dateKey(cursor)
        )
    ) {

        streak++;

        cursor.setDate(
            cursor.getDate() - 1
        );

    }

    return streak;
}


/* =========================================================
   HABIT MODAL
========================================================= */

let editingHabitId = null;


function openHabitModal(habit = null) {

    const modal =
        document.getElementById(
            "habitModal"
        );

    editingHabitId =
        habit
            ? habit.id
            : null;

    document.getElementById(
        "habitModalTitle"
    ).textContent =
        habit
            ? "Edit Habit"
            : "New Habit";

    document.getElementById(
        "habitNameInput"
    ).value =
        habit
            ? habit.name
            : "";

    document.getElementById(
        "habitIconInput"
    ).value =
        habit
            ? habit.icon
            : "🌿";

    modal.classList.add(
        "show"
    );

    setTimeout(() => {

        document
            .getElementById(
                "habitNameInput"
            )
            .focus();

    }, 50);
}


function closeHabitModal() {

    document
        .getElementById(
            "habitModal"
        )
        .classList.remove(
            "show"
        );

    editingHabitId = null;
}


function saveHabitFromModal() {

    const name =
        document
            .getElementById(
                "habitNameInput"
            )
            .value
            .trim();

    const icon =
        document
            .getElementById(
                "habitIconInput"
            )
            .value
            .trim() || "🌿";

    if (!name) {

        showToast(
            "Enter a habit name."
        );

        return;
    }


    if (editingHabitId) {

        const habit =
            data.habits.find(
                item =>
                    item.id ===
                    editingHabitId
            );

        if (habit) {

            habit.name =
                name;

            habit.icon =
                icon;

        }

    } else {

        data.habits.push({

            id:
                crypto.randomUUID(),

            name,

            icon,

            history: {}

        });

    }


    saveData();

    closeHabitModal();

    renderAll();

    showToast(
        editingHabitId
            ? "Habit updated"
            : "Habit created"
    );
}


function editHabit(id) {

    const habit =
        data.habits.find(
            item =>
                item.id === id
        );

    if (habit) {

        openHabitModal(
            habit
        );

    }
}


function deleteHabit(id) {

    const habit =
        data.habits.find(
            item =>
                item.id === id
        );

    if (!habit) return;


    if (
        !confirm(
            `Delete "${habit.name}"?`
        )
    ) {

        return;

    }


    /*
       Keep deleted habits in an archive
       so their historical data is not
       immediately lost.
    */

    if (
        !Array.isArray(
            data.deletedHabits
        )
    ) {

        data.deletedHabits =
            [];

    }


    data.deletedHabits.push({

        ...structuredClone(
            habit
        ),

        deletedAt:
            Date.now()

    });


    data.habits =
        data.habits.filter(
            item =>
                item.id !== id
        );


    saveData();

    renderAll();

    showToast(
        "Habit deleted"
    );
}

function renderTasks() {

    const container =

    if (!data.tasks.length) {

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ✓
                </div>

                <strong>
                    No tasks yet
                </strong>

                <p>
                    Add something you want to accomplish.
                </p>

            </div>

        `;

        return;
    }


    container.innerHTML =
        data.tasks.map(task => `

            <div
                class="
                    task-row
                    ${task.completed ? "completed" : ""}
                "
            >

                <button
                    class="task-check"
                    onclick="
                        toggleTask('${task.id}')
                    "
                >
                    ${
                        task.completed
                            ? "✓"
                            : ""
                    }
                </button>


                <div class="task-content">

                    <div class="task-title">

                        ${escapeHTML(
                            task.title
                        )}

                    </div>

                    <div class="task-meta">

                        ${
                            task.completed
                                ? "Completed"
                                : "Pending"
                        }

                    </div>

                </div>


                <div class="task-actions">

                    <button
                        class="small-button"
                        onclick="
                            editTask('${task.id}')
                        "
                    >
                        ✎
                    </button>

                    <button
                        class="small-button"
                        onclick="
                            deleteTask('${task.id}')
                        "
                    >
                        ×
                    </button>

                </div>

            </div>

        `).join("");
}


/* =========================================================
   NOTES RENDER
========================================================= */

function renderNotes() {

    if (!data.notes.length) {

        data.notes.push({

            id:
                crypto.randomUUID(),

            title:
                "New Note",

            body:
                "",

            updatedAt:
                Date.now()

        });

    }


    if (
        !currentNoteId ||
        !data.notes.some(
            note =>
                note.id ===
                currentNoteId
        )
    ) {

        currentNoteId =
            data.notes[0].id;

    }


    renderNoteListOnly();


    const note =
        data.notes.find(
            item =>
                item.id ===
                currentNoteId
        );

    if (!note) return;


    document.getElementById(
        "noteTitle"
    ).value =
        note.title;

    document.getElementById(
        "noteBody"
    ).value =
        note.body;

    document.getElementById(
        "saveStatus"
    ).textContent =
        "Saved";
}


function renderNoteListOnly() {

    const container =
        document.getElementById(
            "noteList"
        );

    container.innerHTML =
        data.notes.map(note => `

            <div
                class="
                    note-item
                    ${
                        note.id === currentNoteId
                            ? "active"
                            : ""
                    }
                "
                onclick="
                    selectNote('${note.id}')
                "
            >

                <div class="note-item-title">

                    ${escapeHTML(
                        note.title ||
                        "Untitled Note"
                    )}

                </div>


                <div class="note-item-preview">

                    ${escapeHTML(
                        (
                            note.body ||
                            "No additional text"
                        ).replace(
                            /\n/g,
                            " "
                        )
                    )}

                </div>


                <div class="note-item-date">

                    ${formatNoteDate(
                        note.updatedAt
                    )}

                </div>

            </div>

        `).join("");
}


function formatNoteDate(timestamp) {

    const date =
        new Date(timestamp);

    return date.toLocaleDateString(
        "en-US",
        {
            month: "short",
            day: "numeric"
        }
    );
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

    return String(
        value ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}

let toastTimer;


function showToast(message) {

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );
}

/* =========================================================
   RAKKEZ TIMER API
========================================================= */

window.RakkeZProductivity = {

    addFocusSession(minutes) {

        minutes =
            Number(minutes);

        if (
            !Number.isFinite(
                minutes
            ) ||
            minutes <= 0
        ) {

            return;

        }


        data.focusSessions.push({

            id:
                crypto.randomUUID(),

            date:
                Date.now(),

            minutes

        });


        /*
           XP:
           1 XP per focused minute.
        */

        data.xp +=
            Math.round(
                minutes
            );


        /*
           Coins:
           1 coin per 25 focused minutes.
        */

        data.coins +=
            Math.floor(
                minutes / 25
            );


        saveData();

        renderAll();

        showToast(
            `+${minutes}m focus recorded`
        );

    },


    completeHabit(
        habitId,
        key = dateKey()
    ) {

        setHabitCompleted(
            habitId,
            key,
            true
        );

    },


    cancelHabit(
        habitId,
        key = dateKey()
    ) {

        setHabitCompleted(
            habitId,
            key,
            false
        );

    },


    setHabitMinutes(
        habitId,
        minutes,
        key = dateKey()
    ) {

        setHabitMinutes(
            habitId,
            key,
            minutes
        );

    },


    getData() {

        return structuredClone(
            data
        );

    },


    refresh() {

        data =
            loadData();

        renderAll();

    }

};
