<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RakkeZ — Tutorial</title>


    <!-- =====================================================
         FONTS
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         TUTORIAL CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="./tutorial.css"
    >

</head>


<body>

<div class="tutorial-app">


    <!-- =====================================================
         BACKGROUND
    ====================================================== -->

    <div class="background">

        <div class="gradient"></div>

        <div class="noise"></div>

    </div>


    <!-- =====================================================
         TOP BAR
    ====================================================== -->

    <header class="topbar">

        <div class="logo">
            Rakke<span>Z</span>
        </div>


        <div
            class="step-counter"
            id="stepCounter"
        >
            01 / 26
        </div>

    </header>


    <!-- =====================================================
         PROGRESS
    ====================================================== -->

    <div class="progress-track">

        <div
            class="progress-bar"
            id="progressBar"
        ></div>

    </div>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="tutorial-main">

        <section
            class="tutorial-card"
            id="tutorialCard"
        >


            <!-- =================================================
                 ICON
            ================================================== -->

            <div
                class="icon-container"
                id="featureIcon"
            >
                ⏱
            </div>


            <!-- =================================================
                 CATEGORY
            ================================================== -->

            <div
                class="eyebrow"
                id="featureCategory"
            >
                GETTING STARTED
            </div>


            <!-- =================================================
                 TITLE
            ================================================== -->

            <h1 id="featureTitle">
                Welcome to RakkeZ
            </h1>


            <!-- =================================================
                 DESCRIPTION
            ================================================== -->

            <p
                class="description"
                id="featureDescription"
            >
                A simple workspace designed to help you focus
                on one thing at a time.
            </p>


            <!-- =================================================
                 FEATURE DEMO
            ================================================== -->

            <div
                class="demo"
                id="featureDemo"
            ></div>


            <!-- =================================================
                 NAVIGATION
            ================================================== -->

            <div class="navigation">


                <button
                    type="button"
                    class="nav-button secondary"
                    id="backBtn"
                >
                    Back
                </button>


                <button
                    type="button"
                    class="nav-button primary"
                    id="nextBtn"
                >
                    Next
                </button>


            </div>

        </section>

    </main>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="footer">


        <button
            type="button"
            class="skip-button"
            id="skipBtn"
        >
            Skip tutorial
        </button>


        <div
            class="dots"
            id="dots"
        ></div>


    </footer>


    <!-- =====================================================
         FINAL SCREEN
    ====================================================== -->

    <div
        class="final-screen"
        id="finalScreen"
    >


        <div class="final-content">


            <!-- =================================================
                 FINAL ICON
            ================================================== -->

            <div class="final-icon">
                ✓
            </div>


            <!-- =================================================
                 FINAL EYEBROW
            ================================================== -->

            <div class="eyebrow">
                YOU'RE READY
            </div>


            <!-- =================================================
                 FINAL TITLE
            ================================================== -->

            <h2>
                Focus starts now.
            </h2>


            <!-- =================================================
                 FINAL DESCRIPTION
            ================================================== -->

            <p>
                You've learned everything you need
                to make the most out of RakkeZ.
            </p>


            <!-- =================================================
                 FINAL QUESTION
            ================================================== -->

            <div class="final-question">
                Did you understand everything?
            </div>


            <!-- =================================================
                 FINAL ACTIONS
            ================================================== -->

            <div class="final-actions">


                <button
                    type="button"
                    class="final-button primary"
                    id="readyBtn"
                >
                    YES, I'M READY
                </button>


                <button
                    type="button"
                    class="final-button secondary"
                    id="replayBtn"
                >
                    REPLAY TUTORIAL
                </button>


            </div>

        </div>

    </div>


</div>


<!-- =====================================================
     TUTORIAL JAVASCRIPT

     ./ makes the path relative to the current GitHub
     Pages directory instead of the domain root.
====================================================== -->

<script src="./tutorial.js"></script>


</body>

</html>
